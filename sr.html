<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sretan rođendan, Katarina</title>
 
<style>
body {
font-family: "Segoe UI", sans-serif;
height: 100vh;
display: flex;
justify-content: center;
align-items: center;
background: linear-gradient(135deg, #ff9a9e, #fad0c4);
margin: 0;
}
 
.birthday-card {
background: white;
padding: 40px;
border-radius: 20px;
box-shadow: 0 10px 30px rgba(0,0,0,0.2);
text-align: center;
cursor: pointer;
transition: transform 0.3s ease;
}
 
.birthday-card:hover {
transform: scale(1.05);
}
 
h1 {
color: #e91e63;
margin: 0;
}
 
.popup {
display: none;
position: fixed;
inset: 0;
background: rgba(0,0,0,0.6);
justify-content: center;
align-items: center;
}
 
.popup-content {
background: white;
padding: 30px;
border-radius: 20px;
max-width: 450px;
text-align: center;
animation: popIn 0.4s ease;
}
 
.popup-content h2 {
color: #e91e63;
}
 
.close-btn {
margin-top: 15px;
padding: 10px 20px;
border: none;
background: #e91e63;
color: white;
border-radius: 10px;
cursor: pointer;
}
 
@keyframes popIn {
from {
transform: scale(0.7);
opacity: 0;
}
to {
transform: scale(1);
opacity: 1;
}
}
</style>
</head>
 
<body>
 
<div class="birthday-card" onclick="showPopup()">
<h1>Sretan rođendan, Katarina.<br>🎂</h1>
</div>
 
<div class="popup" id="popup">
<div class="popup-content">
<h2>💝 Najljepše želje!</h2>
<p>
Želim ti sretan rođendan i što brži oporavak.
Neka ti svaki novi dan života bude kao dobra rakija. Što stariji to bolji.
Čuvaj se i uskoro se vrati potpuno zdrava! ❤️
</p>
<button class="close-btn" onclick="closePopup()">Zatvori</button>
</div>
</div>
 
<script>
function showPopup() {
document.getElementById("popup").style.display = "flex";
}
 
function closePopup() {
document.getElementById("popup").style.display = "none";
}
</script>
 
</body>
</html>

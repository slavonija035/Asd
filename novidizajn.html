<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kako ste danas?</title>
 
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}
 
body{
font-family: 'Segoe UI', sans-serif;
background: linear-gradient(135deg, #667eea, #764ba2);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}
 
.container{
background:white;
padding:40px;
border-radius:25px;
text-align:center;
width:90%;
max-width:550px;
box-shadow:0 15px 40px rgba(0,0,0,0.25);
animation:fadeIn 1s ease;
}
 
h1{
color:#333;
margin-bottom:25px;
font-size:2rem;
}
 
.subtitle{
color:#666;
margin-bottom:25px;
}
 
button{
width:100%;
padding:16px;
margin:10px 0;
border:none;
border-radius:15px;
font-size:18px;
cursor:pointer;
transition:all 0.3s ease;
color:white;
font-weight:bold;
}
 
button:hover{
transform:translateY(-3px) scale(1.02);
}
 
.btn1{
background:linear-gradient(45deg,#00c853,#69f0ae);
}
 
.btn2{
background:linear-gradient(45deg,#2196f3,#64b5f6);
}
 
.btn3{
background:linear-gradient(45deg,#ff9800,#ffcc80);
}
 
.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
display:none;
justify-content:center;
align-items:center;
}
 
.popup-content{
background:white;
padding:30px;
border-radius:25px;
width:90%;
max-width:420px;
text-align:center;
animation:zoomIn 0.4s ease;
}
 
.popup-content h2{
margin-bottom:15px;
}
 
.popup-content p{
color:#555;
margin-bottom:20px;
line-height:1.5;
}
 
.close-btn{
background:#6c63ff;
color:white;
border:none;
border-radius:12px;
padding:12px 20px;
cursor:pointer;
font-size:16px;
}
 
@keyframes fadeIn{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}
 
@keyframes zoomIn{
from{
transform:scale(0.7);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}
</style>
</head>
 
<body>
 
<div class="container">
<h1>🌞 Kako ste danas?</h1>
<p class="subtitle">Odaberite odgovor koji vas najbolje opisuje.</p>
 
<button class="btn1" onclick="showMessage('😄 Odlično!', 'Fantastično! Vaša pozitivna energija može uljepšati dan i vama i ljudima oko vas. Nastavite tako! ✨')">
😄 Odlično, pun/a sam energije!
</button>
 
<button class="btn2" onclick="showMessage('🙂 Sasvim dobro', 'Ne mora svaki dan biti spektakularan. Važno je da idete naprijed korak po korak. Svaki mali napredak je uspjeh. 💪')">
🙂 Nije loše, ide nekako.
</button>
 
<button class="btn3" onclick="showMessage('🙏 Držite se', 'Svi imamo teže dane. Budite blagi prema sebi i ne zaboravite da nakon svakog oblaka ponovno zasja sunce. ❤️')">
😕 Iskreno, nije baš moj dan.
</button>
</div>
 
<div class="popup" id="popup">
<div class="popup-content">
<h2 id="popupTitle"></h2>
<p id="popupText"></p>
<button class="close-btn" onclick="closePopup()">Zatvori</button>
</div>
</div>
 
<script>
function showMessage(title, text){
document.getElementById("popupTitle").innerHTML = title;
document.getElementById("popupText").innerHTML = text;
document.getElementById("popup").style.display = "flex";
}
 
function closePopup(){
document.getElementById("popup").style.display = "none";
}
 
window.onclick = function(event){
const popup = document.getElementById("popup");
if(event.target === popup){
popup.style.display = "none";
}
}
</script>
 
</body>
</html>

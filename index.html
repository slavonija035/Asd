<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Pitanje za Katarinu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }

        button {
            font-size: 20px;
            padding: 10px 20px;
            margin: 10px;
        }

        #ne {
            position: absolute;
        }
    </style>
</head>
<body>

<h1>Katarina, hoćeš li izaći sa mnom na večeru nakon što se oporaviš? ❤️</h1>

<button onclick="alert('Odlično! 😊')">DA</button>
<button id="ne">NE</button>

<script>
    const neBtn = document.getElementById("ne");

    neBtn.addEventListener("mouseover", () => {
        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 50);

        neBtn.style.left = x + "px";
        neBtn.style.top = y + "px";
    });
</script>

</body>
</html>
